name: Deploy Study Planner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}

          script: |
            cd ~/study-planner

            git pull origin main

            # Backend setup
            cd server
            npm install
            pm2 restart backend || pm2 start server.js --name backend

            # Frontend setup
            cd ../client
            npm install
            npm run build

            # Restart frontend
            pm2 delete frontend || true
            pm2 start "serve -s dist -l 5175" --name frontend

            # Save PM2
            pm2 save